name: Sync approved portfolio files

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-approved-portfolio
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out private source with read-only access
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Cellie0320/Marcel-De-Lange-Portfolio-V2
          ref: main
          path: source
          ssh-key: ${{ secrets.PORTFOLIO_SOURCE_READ_KEY }}
          persist-credentials: false

      - name: Test publishing exclusions and website
        run: node --test source/tests/publish-site.test.cjs source/tests/stats-counts.test.js

      - name: Export approved website files
        run: node source/scripts/publish-site.cjs source "$RUNNER_TEMP/public-site"

      - name: Check out public website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: public
          ssh-key: ${{ secrets.PORTFOLIO_SITE_WRITE_KEY }}

      - name: Update only the public website snapshot
        shell: bash
        run: |
          set -euo pipefail
          # Preserve public CI configuration and this checkout's Git directory.
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' "$RUNNER_TEMP/public-site/" public/
          git -C public config user.name 'github-actions[bot]'
          git -C public config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C public add --all
          if git -C public diff --cached --quiet; then
            echo 'Website is already up to date.'
          else
            git -C public commit -m 'Update portfolio website'
            # SSH authentication allows this push to trigger the Pages build.
            git -C public push origin HEAD:main
          fi
